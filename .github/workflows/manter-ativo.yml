# Mantém o banco do Supabase (plano gratuito) acordado: o Supabase pausa projetos gratuitos
# com pouca atividade em 7 dias. Duas vezes por dia fazemos uma consulta leve e pública.
# No plano Pro do Supabase isto deixa de ser necessário (projetos pagos nunca são pausados).
name: Manter o banco ativo

on:
  schedule:
    - cron: '17 11 * * *'   # 08:17 em Brasília
    - cron: '43 23 * * *'   # 20:43 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta leve ao banco
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" js/config.js)
          KEY=$(grep -oP "SUPABASE_KEY = '\K[^']+" js/config.js)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/verificar_certificado" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_codigo":"MANTERATIVO"}')
          echo "Resposta do banco: $code"
          test "$code" = "200" -o "$code" = "204"
